# Publishes the package to npm when a v*.*.* tag is pushed.
#
# Uses npm Trusted Publishing (GitHub OIDC), so no npm token is stored here. One-time setup on
# npmjs.com: package settings -> Trusted Publisher -> GitHub Actions, repository
# oxylabs/oxylabs-ai-sdk, workflow publish.yml, environment npm, "Allow npm publish" ticked.
# Trusted Publishing can only be added to a package that already exists, so the very first
# version has to be published once by hand.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm test

      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm publish --provenance --access public
